[package]
name = "croniter"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Rust port of pallets-eco/croniter: cron expression parsing and datetime iteration"

[lib]
name = "croniter"
path = "src/lib.rs"

[[bin]]
name = "croniter-conformance"
path = "src/bin/conformance.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
divan = "0.1.21"

[[bench]]
name = "schedule"
harness = false

[profile.release]
lto = true
codegen-units = 1
